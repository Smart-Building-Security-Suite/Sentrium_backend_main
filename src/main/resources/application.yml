spring:
  application:
    name: security-suite-backend
  datasource:
    url: ${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/security_suite_dev}}
    username: ${DATABASE_USERNAME:${DB_USERNAME:postgres}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:postgres}}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_A_64_CHAR_RANDOM_SECRET_NEVER_USE_THIS_DEFAULT}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://security-suite-frontend.vercel.app}
  reports-dir: ${APP_REPORTS_DIR:reports}
  rate-limit:
    auth:
      max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:20}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  video:
    storage-path: ${VIDEO_STORAGE_PATH:${user.home}/sentrium/videos}
    retention-days: ${VIDEO_RETENTION_DAYS:30}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
