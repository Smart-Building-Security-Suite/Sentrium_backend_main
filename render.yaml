services:
  # Spring Boot Backend Service
  - type: web
    name: sentrium-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      # Database Configuration
      - key: DATABASE_URL
        value: jdbc:postgresql://ep-falling-shape-ay6u866f-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_USERNAME
        value: neondb_owner
      - key: DATABASE_PASSWORD
        sync: false  # Mark as secret - set this in Render dashboard

      # JWT Configuration
      - key: JWT_SECRET
        sync: false  # Mark as secret - set this in Render dashboard
      - key: JWT_ACCESS_TOKEN_EXPIRATION_MS
        value: 900000
      - key: JWT_REFRESH_TOKEN_EXPIRATION_MS
        value: 604800000

      # Hibernate Configuration
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update  # Change to 'validate' after first deployment
      - key: SPRING_JPA_SHOW_SQL
        value: false

      # Server Configuration
      - key: PORT
        value: 8080

      # CORS Configuration - Update with your frontend URLs
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app,https://your-frontend.render.com

      # Mail Configuration (optional - configure if using email)
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false  # Set in dashboard if using email
      - key: MAIL_PASSWORD
        sync: false  # Set in dashboard if using email

      # Reports Directory
      - key: APP_REPORTS_DIR
        value: /tmp/reports

      # Rate Limiting
      - key: AUTH_RATE_LIMIT_MAX_REQUESTS
        value: 20
      - key: AUTH_RATE_LIMIT_WINDOW_SECONDS
        value: 60

    # Health check endpoint
    healthCheckPath: /api/v1/actuator/health

    # Auto-deploy when pushing to main branch
    autoDeploy: true

    # Build settings
    buildCommand: echo "Using Docker build"

    # Resource settings (adjust based on your needs)
    plan: starter  # or 'free' for free tier

    # Region - choose closest to your users
    region: oregon  # or singapore, frankfurt, ohio, etc.
