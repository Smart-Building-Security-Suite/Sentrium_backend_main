services:
  # Spring Boot Backend Service
  - type: web
    name: sentrium-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      # Database Configuration
      - key: DATABASE_URL
        value: jdbc:postgresql://ep-falling-shape-ay6u866f-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_USERNAME
        value: neondb_owner
      - key: DATABASE_PASSWORD
        value: npg_l5wxpIHPYBF9

      # JWT Configuration (IMPORTANT: Set JWT_SECRET in dashboard after deployment!)
      - key: JWT_SECRET
        value: CHANGE_ME_AFTER_DEPLOY  # MUST be replaced in Render dashboard!
      - key: JWT_ACCESS_TOKEN_EXPIRATION_MS
        value: 900000
      - key: JWT_REFRESH_TOKEN_EXPIRATION_MS
        value: 604800000

      # Hibernate Configuration
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update  # Change to 'validate' after first deployment
      - key: SPRING_JPA_SHOW_SQL
        value: false

      # Server Configuration
      - key: PORT
        value: 8080

      # CORS Configuration - For React Native/Expo
      # Native apps don't need CORS, but include your Expo web URL if using it
      - key: APP_CORS_ALLOWED_ORIGINS
        value: http://localhost:8081,exp://localhost:8081,https://your-expo-web-url.vercel.app

      # Mail Configuration (optional - configure if using email)
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false  # Set in dashboard if using email
      - key: MAIL_PASSWORD
        sync: false  # Set in dashboard if using email

      # Reports Directory
      - key: APP_REPORTS_DIR
        value: /tmp/reports

      # Rate Limiting
      - key: AUTH_RATE_LIMIT_MAX_REQUESTS
        value: 20
      - key: AUTH_RATE_LIMIT_WINDOW_SECONDS
        value: 60

    # Health check endpoint
    healthCheckPath: /api/v1/actuator/health

    # Auto-deploy when pushing to main branch
    autoDeploy: true

    # Build settings
    buildCommand: echo "Using Docker build"

    # Resource settings (adjust based on your needs)
    plan: starter  # or 'free' for free tier

    # Region - choose closest to your users
    region: oregon  # or singapore, frankfurt, ohio, etc.
